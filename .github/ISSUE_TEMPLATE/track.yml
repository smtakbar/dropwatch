name: Track a product
description: Add a product link from any country's store
title: "track: "
body:
  - type: input
    id: link
    attributes:
      label: Product link
      description: Any store, any country
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: Optional. Leave blank to use the page title.
  - type: input
    id: target
    attributes:
      label: Target price
      description: Optional. You get an alert when the price is at or below this.
  - type: dropdown
    id: currency
    attributes:
      label: Target currency
      options: [AUD, USD, GBP, EUR, CAD, JPY, INR, SGD, NZD, AED, BRL, KRW]
      default: 0
