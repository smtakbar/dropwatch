name: Track a product
description: Add a product link from any country's store
title: "track: "
body:
  - type: input
    id: link
    attributes:
      label: Product link
      description: Any store, any country
  - type: input
    id: name
    attributes:
      label: Name
      description: Product name. Required if there is no link; helps find the same product at other stores.
  - type: input
    id: target
    attributes:
      label: Target price
      description: Optional. You get an alert when the price is at or below this.
  - type: dropdown
    id: currency
    attributes:
      label: Target currency
      options: [AUD, USD, GBP, EUR, CAD, JPY, INR, SGD, NZD, AED, BRL, KRW]
      default: 0
  - type: dropdown
    id: country
    attributes:
      label: Country
      options: [AU, US, GB, CA, DE, FR, JP, IN, SG, NZ, AE, BR, KR]
      default: 0
