name: Analysis
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Monte Carlo (only runs on products with enough history)
        run: node analysis/monte-carlo.mjs
      - name: Commit
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add data/analysis.json
          git diff --cached --quiet || (git commit -m "Update analysis" && git pull --rebase && git push)
