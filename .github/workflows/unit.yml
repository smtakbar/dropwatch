name: Unit tests
on:
  push:
    paths: [docs/engine.js, tests/country.mjs, .github/workflows/unit.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Store-country detection regression table
        run: node tests/country.mjs
