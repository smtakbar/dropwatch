name: Validate live site
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [tests/**, .github/workflows/validate.yml]

permissions:
  contents: write

concurrency:
  group: validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: npm install --no-save --no-audit --no-fund playwright-core axe-core lighthouse chrome-launcher
      - name: End-to-end validation on the live site
        run: node tests/e2e.mjs
        continue-on-error: true
      - name: Lighthouse
        run: node tests/lighthouse.mjs
        continue-on-error: true
      - name: Commit reports
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "Validation reports" && git pull --rebase && git push)
