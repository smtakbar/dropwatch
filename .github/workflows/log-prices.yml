name: Log prices
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [data/seed.json, scripts/log-prices.mjs, .github/workflows/log-prices.yml]

permissions:
  contents: write

concurrency:
  group: log-prices
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Log prices
        run: node scripts/log-prices.mjs
      - name: Commit data
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add data/prices.csv data/fetch-log.csv
          git diff --cached --quiet || (git commit -m "Log prices" && git pull --rebase && git push)
