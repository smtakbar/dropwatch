name: Probe (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs; node scripts/probe2.mjs || true
      - run: |
          git config user.name "dropwatch-bot"; git config user.email "dropwatch-bot@users.noreply.github.com"
          git add reports/probe.json reports/probe2.json; git diff --cached --quiet || (git commit -m "Probe results" && git pull --rebase && git push)
