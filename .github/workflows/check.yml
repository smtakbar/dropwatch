name: Check prices
on:
  workflow_dispatch: {}   # manual only; the website now runs entirely in each visitor's browser

permissions:
  contents: write
  issues: write

concurrency:
  group: dropwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser driver (fallback for JS-rendered stores)
        run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Check prices
        run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit data
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --rebase && git push)
