name: Check prices
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [watchlist.json, "scripts/**", ".github/workflows/check.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: dropwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser driver (fallback for JS-rendered stores)
        run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Check prices
        run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --rebase && git push)
