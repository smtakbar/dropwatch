name: Track or remove product
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: dropwatch
  cancel-in-progress: false

jobs:
  track:
    # Only the repo owner can change the watchlist.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'track:') || startsWith(github.event.issue.title, 'remove:'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update watchlist
        run: node scripts/track.mjs
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Check prices
        run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          QUICK: "1"
      - name: Commit
        run: |
          git config user.name "dropwatch-bot"
          git config user.email "dropwatch-bot@users.noreply.github.com"
          git add watchlist.json docs/data.json
          git diff --cached --quiet || (git commit -m "Update watchlist" && git pull --rebase && git push)
      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh issue close "$NUM"
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" || true
