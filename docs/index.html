<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DropWatch</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--surface2:#f1f0ea;--border:#e4e2d9;--border2:#cfcdc2;--text:#1a1a18;--text2:#5f5e58;--text3:#8d8b82;--green:#3b6d11;--green-bg:#eaf3de;--red:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--surface:#1f1f1c;--surface2:#292926;--border:#33332f;--border2:#45453f;--text:#f2f1ec;--text2:#b0aea4;--text3:#7d7b72;--green:#8fc25a;--green-bg:#26361a;--red:#f09595}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
button,select,input{font:inherit;font-size:14px;color:var(--text)}
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{font-size:19px;font-weight:300;letter-spacing:-.5px}.logo b{font-weight:700}.sp{flex:1}
.btn{background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);font-weight:400}
.btn.small{padding:4px 9px;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.card.hit{border:2px solid #639922}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--text2);font-size:12px}
.price{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--green-bg);color:var(--green)}
.err{color:var(--red);font-size:12px;margin-top:6px}
.name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text2)}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:18px;font-weight:600;flex:1 1 100%}
.hero input{flex:1 1 280px}
input[type=text],input[type=password]{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:460px}
.box h2{font-size:17px;margin-bottom:12px}.box label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat{background:var(--surface2);border-radius:8px;padding:6px 8px}.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.verdict{font-size:12px;font-weight:500;margin:6px 0;padding:6px 8px;border-radius:8px;background:var(--surface2)}
.verdict.good{background:var(--green-bg);color:var(--green)}
a{color:inherit}.link{color:#185fa5;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}td,th{padding:5px 4px;border-top:1px solid var(--border);text-align:left}th{color:var(--text2);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.cheap{color:var(--green);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:30}
.toast.on{display:block}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--border);flex:none}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text3);background:var(--surface2)}
.chart{margin:8px 0;background:var(--surface2);border-radius:10px;padding:8px}
.chart svg{display:block;width:100%;height:110px}
.chart .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:2px}
.pend{border:1px dashed var(--border2)}
.bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:#639922;width:0;transition:width .9s linear}
details.d summary{cursor:pointer;color:var(--text2);font-size:12px;margin-top:6px}
.advice{border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface2)}
.advice b{display:block;font-size:15px}.advice span{font-size:12px;color:var(--text2)}
.advice.buy{background:var(--green-bg)}.advice.buy b{color:var(--green)}
.advice.wait{background:#fdf0dc}.advice.wait b{color:#9a5b00}
@media(prefers-color-scheme:dark){.advice.wait{background:#3a2e17}.advice.wait b{color:#f0b95a}}
.best{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:6px}.tabs button{border:1px solid var(--border2);background:transparent;border-radius:6px;padding:2px 8px;font-size:11px;color:var(--text2);cursor:pointer}.tabs button.on{background:var(--text);color:var(--bg)}
.oos{font-size:11px;color:var(--red);font-weight:500}
</style>
</head>
<body>
<div class="top">
  <div class="logo">drop<b>watch</b></div><div class="sp"></div>
  <select id="region" aria-label="Region"></select>
  <button class="btn" id="add">+ Track product</button>
</div>
<div class="wrap">
  <div class="hero"><h1>Track any product. Paste a link or type its name, and we watch the price across stores and tell you when to buy.</h1>
    <input type="text" id="quick" placeholder="Product name or link, e.g. Marvis Sweet &amp; Sour Rhubarb Toothpaste 75 ml"><button class="btn" id="quickGo">Track</button>
    <div class="muted" style="flex:1 1 100%">Private by design: no sign-in. Your list is saved only in this browser, and prices refresh whenever this page is open.</div></div>
  <div class="row" style="margin-bottom:14px"><span class="muted" id="meta"></span></div>
  <div id="pend" style="margin-bottom:12px"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal"><div class="box">
  <h2>Track a product</h2>
  <label for="m-url">Product name or link</label><input type="text" id="m-url" placeholder="Marvis Sweet &amp; Sour Rhubarb Toothpaste 75 ml">
  <div id="m-namebox" style="display:none"><label for="m-name">Product name (optional, helps find it at other stores)</label><input type="text" id="m-name" placeholder="Leave blank to use the page title"></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="m-go">Start tracking</button></div>
</div></div>
<div class="toast" id="toast" style="max-width:90vw"></div>
<script src="engine.js"></script>
<script>
const COUNTRIES=[["AU","Australia","🇦🇺","AUD"],["US","United States","🇺🇸","USD"],["GB","United Kingdom","🇬🇧","GBP"],["CA","Canada","🇨🇦","CAD"],["DE","Germany","🇩🇪","EUR"],["FR","France","🇫🇷","EUR"],["JP","Japan","🇯🇵","JPY"],["IN","India","🇮🇳","INR"],["SG","Singapore","🇸🇬","SGD"],["NZ","New Zealand","🇳🇿","NZD"],["AE","UAE","🇦🇪","AED"],["BR","Brazil","🇧🇷","BRL"],["KR","South Korea","🇰🇷","KRW"]];
const flag=id=>(COUNTRIES.find(c=>c[0]===id)||[])[2]||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const conv=(a,f,t,r)=>(f===t||!r[f]||!r[t])?a:a/r[f]*r[t];
const fmt=(a,c)=>{const z=c==="JPY"||c==="KRW";try{return new Intl.NumberFormat("en-AU",{style:"currency",currency:c,minimumFractionDigits:z?0:2,maximumFractionDigits:z?0:2}).format(a)}catch{return c+" "+a.toFixed(z?0:2)}};
const ago=iso=>{if(!iso)return"never";const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};


const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),9000)}

// ---- This browser's own list (never leaves the device) ----
const KEY="dw_items";
let ITEMS=[];try{ITEMS=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ITEMS.map(({busy,...x})=>x)))}catch{toast("Your browser blocked saving. The list will be lost when you close this page.")}};
let RATES={USD:1,AUD:1.53,GBP:0.79,EUR:0.92,JPY:150,CAD:1.36,INR:83,SGD:1.34,NZD:1.65,AED:3.67,BRL:5,KRW:1350};

// ---- Region: your own choice, else guessed from your location ----
let region="AU",hadRegion=false;try{const r=localStorage.getItem("region");if(r){region=r;hadRegion=true}}catch{}
const sel=$("region");
sel.innerHTML=COUNTRIES.map(c=>`<option value="${c[0]}">${c[2]} ${esc(c[1])} (${c[3]})</option>`).join("");
sel.value=region;
sel.onchange=()=>{region=sel.value;try{localStorage.setItem("region",region)}catch{}render()};
if(!hadRegion)fetch("https://ipwho.is/?fields=success,country_code").then(r=>r.json()).then(j=>{
  if(j&&j.success&&COUNTRIES.some(c=>c[0]===j.country_code)){region=j.country_code;sel.value=region;try{localStorage.setItem("region",region)}catch{}render();toast("Showing prices for "+(COUNTRIES.find(c=>c[0]===region)||[])[1]+" (from your location).")}}).catch(()=>{});

const RANGE={};
window.setRange=(id,d)=>{RANGE[id]=d;render()};
const tabs=id=>`<div class="tabs">${[[7,"7d"],[30,"30d"],[90,"90d"],[0,"All"]].map(([d,l])=>`<button class="${(RANGE[id]||0)===d?"on":""}" onclick="setRange('${id}',${d})">${l}</button>`).join("")}</div>`;
function chart(h,cur,r,from,id){
  if(!h||!h.length)return"";
  const days=RANGE[id]||0;if(days){const c=Date.now()-days*864e5;const f=h.filter(x=>Date.parse(x[0])>=c);h=f.length?f:h.slice(-1)}
  if(h.length<2)return`<div class="chart"><div class="muted" style="padding:10px 4px">Price graph starts after the second price change. Checked once so far.</div></div>`;
  const v=h.map(x=>conv(x[1],from,cur,r)),t=h.map(x=>Date.parse(x[0])),w=300,ht=100,mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn||1,t0=t[0],tt=(t.at(-1)-t0)||1;
  const X=i=>6+((t[i]-t0)/tt)*(w-12),Y=y=>ht-10-((y-mn)/sp)*(ht-24);
  const pts=v.map((y,i)=>`${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(" ");
  const lo=v.indexOf(mn);
  const d=x=>new Date(x).toLocaleDateString("en-AU",{day:"numeric",month:"short"});
  return`<div class="chart"><svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" role="img" aria-label="Price history"><polyline points="${pts}" fill="none" stroke="#185fa5" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${X(lo)}" cy="${Y(mn)}" r="3.5" fill="#3b6d11"/></svg>
  <div class="ax"><span>${d(t[0])}</span><span>Low ${fmt(mn,cur)} · High ${fmt(mx,cur)}</span><span>${d(t.at(-1))}</span></div>${tabs(id)}</div>`;
}

let PEND=null,ptimer=null;
function renderPending(){
  const el=$("pend");if(!el)return;
  if(!PEND){el.innerHTML="";return}
  const sec=Math.round((Date.now()-PEND.start)/1000),est=25;
  el.innerHTML=`<div class="card pend"><div class="name">${esc(PEND.label)}</div><div class="bar"><i style="width:${Math.min(95,sec/est*100)}%"></i></div>
  <div class="muted">Reading the price… ${sec}s (usually under 30s)</div></div>`;
}



function render(){
  const LIST=ITEMS,reg=COUNTRIES.find(c=>c[0]===region)||COUNTRIES[0],cur=reg[3],r=RATES;
  const hits=LIST.filter(i=>i.price!=null&&i.targetPrice!=null&&i.price<=conv(i.targetPrice,i.targetCurrency||i.currency,i.currency,r)).length;
  document.getElementById("meta").textContent=LIST.length?`${LIST.length} on your list · saved in this browser only`:"";
  const g=document.getElementById("grid");
  renderPending();
  if(!LIST.length){g.innerHTML=`<div class="empty">Your list is empty. Paste a product link or type a name above. Your list stays in this browser and is private to you.</div>`;return}
  g.innerHTML=LIST.map(i=>{
    const hit=i.price!=null&&i.targetPrice!=null&&i.price<=conv(i.targetPrice,i.targetCurrency||i.currency,i.currency,r);
    const L=v=>v!=null?fmt(conv(v,i.currency,cur,r),cur):"–";
    const local=i.price!=null?conv(i.price,i.currency,cur,r):null;
    const foreign=i.currency&&i.currency!==cur;
    const ins=i.insight;
    const good=ins&&/Lowest|Close/.test(ins.verdict);
    const offers=[...(i.url?[{store:i.retailer,url:i.url,price:i.price,currency:i.currency,own:true}]:[]),...(i.offers||[])].filter(o=>o.price!=null)
      .map(o=>({...o,v:conv(o.price,o.currency||i.currency,cur,r)})).sort((x,y)=>x.v-y.v);
    const tbl=offers.length>1?`<table><tr><th>Store</th><th class="r">Price</th><th></th></tr>${offers.map((o,k)=>`<tr><td>${esc(o.store)}${o.own?" · your link":""}</td><td class="r ${k===0?"cheap":""}">${fmt(o.v,cur)}${k===0?" ✓":""}</td><td class="r"><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Open</a></td></tr>`).join("")}</table>`:
      `<div class="muted" style="margin-top:6px">${i.offersAt?"No other trusted stores found for this exact product.":"Looking at other stores…"}</div>`;
    return`<div class="card ${hit?"hit":""}">
      <div class="row" style="align-items:flex-start">
        ${i.image?`<img class="thumb" src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;thumb ph&quot;>📦</div>'">`:`<div class="thumb ph">📦</div>`}
        <div style="min-width:0;flex:1"><div class="name" title="${esc(i.name||i.matchName)}">${esc(i.name||i.matchName||"Loading product…")}</div>
        <div class="muted">${flag(i.storeCountry)} ${esc(i.retailer||"Searching stores")} · checked ${ago(i.checkedAt)}</div></div>
        ${hit?'<span class="pill">Target hit</span>':""}
      </div>
      <div style="margin:10px 0 6px">${local!=null?`<span class="price">${fmt(local,cur)}</span>${i.inStock===false?' <span class="oos">Out of stock</span>':""}${foreign?` <span class="muted">(${fmt(i.price,i.currency)} at store)</span>`:""}`:'<span class="muted">Finding the price…</span>'}</div>
      ${i.advice?`<div class="advice ${esc(i.advice.action)}"><b>${esc(i.advice.headline)}</b><span>${esc(i.advice.reason)}</span></div>
      <div class="best"><span>Cheapest found: <b>${esc(i.advice.best.store)}</b> ${fmt(conv(i.advice.best.price,i.advice.best.currency||i.currency,cur,r),cur)}${i.advice.best.own?" (your link)":""}</span><a class="btn small" href="${esc(i.advice.best.url)}" target="_blank" rel="noopener noreferrer">Go to store</a></div>`:""}
      ${ins?`${i.advice?"":`<div class="verdict ${good?"good":""}">${esc(ins.verdict)}</div>`}
      <div class="stats"><div class="stat"><span class="muted">Lowest seen</span><b>${L(ins.lowest)}</b></div><div class="stat"><span class="muted">Average</span><b>${L(ins.avg)}</b></div><div class="stat"><span class="muted">Likely low (${esc(ins.bestMonth)})</span><b>${L(ins.predictedLow)}</b></div></div>
      <div class="muted">${ins.basis==="observed"?"Estimate based on this product's own price history.":"Estimate based on usual sale seasons. It gets more accurate as we collect prices."}</div>`:""}
      ${chart(i.history,cur,r,i.currency,i.id)}
      ${tbl}
      ${i.error&&i.price==null?`<div class="err">We couldn't read a price from this store yet.<details class="d"><summary>Details</summary>${esc(i.error)}</details></div>`:""}
      ${i.busy?`<div class="muted">Refreshing…</div>`:""}
      <div class="row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);justify-content:space-between">
        <span class="muted">${i.targetPrice!=null?`Target: <b style="color:var(--text)">${fmt(conv(i.targetPrice,i.targetCurrency||cur,cur,r),cur)}</b>`:"We notify you here when the price drops"}</span>
        <span class="row">${i.url?`<a class="btn ghost small" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">Open</a>`:""}
        <button class="btn ghost small" onclick="removeItem('${esc(i.id)}')">Remove</button></span>
      </div></div>`}).join("");
}

const isLink=v=>/^https?:\/\//i.test(v)||(/^[^\s]+\.[a-z]{2,}(\/|$)/i.test(v)&&!/\s/.test(v));
function openModal(v){$("modal").classList.add("on");$("m-url").value=v||"";$("m-namebox").style.display=isLink(v||"")?"block":"none";$("m-url").focus()}
function closeModal(){$("modal").classList.remove("on")}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
$("add").onclick=()=>openModal("");
$("quickGo").onclick=()=>{const v=$("quick").value.trim();if(v)openModal(v)};
$("quick").onkeydown=e=>{if(e.key==="Enter")$("quickGo").click()};
$("m-url").oninput=()=>{$("m-namebox").style.display=isLink($("m-url").value.trim())?"block":"none"};

function notify(it){
  try{if("Notification" in window&&Notification.permission==="granted")new Notification("Price drop: "+(it.name||it.matchName||"your product"),{body:DW.fmt(it.price,it.currency)+(it.retailer?" at "+it.retailer:"")})}catch{}
}
async function refresh(it,offers){
  it.busy=true;render();
  try{const r=await DW.refreshItem(it,RATES,{offers});if(r.dropped)notify(it)}catch(e){it.error="Something went wrong. We will try again."}
  it.busy=false;save();render();
}
$("m-go").onclick=async()=>{
  const v=$("m-url").value.trim();if(!v)return;
  if(/^(github_pat_|ghp_|gho_|ghs_|sk-)/i.test(v)){toast("That looks like a secret key, not a product.");return}
  const it=DW.makeItem(v,$("m-name").value,region);
  closeModal();$("quick").value="";
  ITEMS.unshift(it);save();
  try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch{}
  PEND={label:it.name||it.url,start:Date.now()};renderPending();
  clearInterval(ptimer);ptimer=setInterval(renderPending,1000);
  render();
  await refresh(it,true);
  PEND=null;clearInterval(ptimer);renderPending();
  if(it.price==null)toast(it.error||"Added, but no price yet.");
};
window.removeItem=id=>{if(!confirm("Stop tracking this product?"))return;ITEMS=ITEMS.filter(i=>i.id!==id);save();render()};

// ---- Refresh whatever is stale while the page is open ----
async function sweep(){
  for(const it of ITEMS){if(it.busy)continue;if(!it.checkedAt||Date.now()-Date.parse(it.checkedAt)>3600e3)await refresh(it,false)}
}
render();
DW.getRates().then(r=>{RATES=r;render()}).finally(()=>{sweep();setInterval(sweep,15*60e3)});
</script>
</body>
</html>
